<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playwrite+CU+Guides&family=Roboto:ital,wght@0,100..900;1,100..900&family=Sansita:ital,wght@0,400;0,700;0,800;0,900;1,400;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Weather app</title>
  </head>
  <body>
        <div class="weather-app">
    <header>
        <form class="search-form">
            <input type="search" placeholder="Enter a city.." required class="search-form-input"/>
            <input type="submit" value="Search" class="search-form-button" />
        </form>
    </header>
    <main>
        <div class="weather-app-data">
        <div>
    <h1 class="weather-app-city">Sooke</h1>
    <p class ="weather-app-details">
        Tuesday 14:49, scattered clouds and rain
        <br />
        Humidty: <strong>66%</strong>, Wind: <strong>3.13km/h</strong>
    </p>
    </div>
    <div class="weather-app-temperature-container">
      <div class="weather-app-icon">🌦️</div> 
      <div class="weather-app-temp-value">12</div>
      <div class="weather-app-unit">°C</div>
    </div>
</div>    
</main>
    <footer>
      Coded by
      <a href="https://github.com/sherilynsutton" target="_blank"
        >Sherilyn Sutton</a
      >
      and is hosted on
      <a
        href="https://github.com/sherilynsutton/week7_weather_app"
        target="_blank"
        >GitHub</a
      >
      and hosted on
      <a href="https://ss-week7-app.netlify.app/" target="_blank">Netlify</a>
    </footer>
    
    </div>
  </body>
</html>
